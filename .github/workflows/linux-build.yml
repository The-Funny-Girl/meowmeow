name: Linux build

on:
  push:
    branches: [main, linux-port, linux-ui-port, linux-ingame-menu]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preserve-windows-runtime:
    name: preserve Windows runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Linux helpers
        run: |
          test -x build-linux.sh
          test -x install-gmod-addon.sh
          bash -n build-linux.sh
          bash -n install-gmod-addon.sh
          ./build-linux.sh --help >/dev/null
          ./install-gmod-addon.sh --help >/dev/null

      - name: Test Garry's Mod addon installer
        run: |
          set -euo pipefail
          fake_game="$RUNNER_TEMP/GarrysMod"
          mkdir -p "$fake_game/garrysmod/addons"
          ./install-gmod-addon.sh --game-dir "$fake_game"
          test -f "$fake_game/garrysmod/addons/kirkware_linux/addon.json"
          test -f "$fake_game/garrysmod/addons/kirkware_linux/lua/autorun/client/kirkware_linux.lua"
          ./install-gmod-addon.sh --game-dir "$fake_game" --uninstall
          test ! -e "$fake_game/garrysmod/addons/kirkware_linux"

      - name: Validate Garry's Mod addon Lua syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p source/gmod_addon/kirkware_linux/lua/autorun/client/kirkware_linux.lua

      - name: Verify preserved Windows runtime is unchanged
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            base="HEAD^"
          else
            git fetch --no-tags origin main
            base="origin/main"
          fi

          protected_paths=(
            BUILD.ps1
            BUILDING.txt
            source/app.manifest
            source/core
            source/ui
            source/assets/active-image-b1.bin
            source/assets/bootstrap-b1.dll
            source/assets/bootstrap-b2.dll
            source/assets/reconstructed-bss.bin
            source/assets/reconstructed-bss.mask.bin
            source/assets/mbcinfo-template.bin
          )

          if ! git diff --quiet "$base" HEAD -- "${protected_paths[@]}"; then
            echo "The preserved Windows runtime changed. Linux portability work must not modify these paths:"
            git diff --name-only "$base" HEAD -- "${protected_paths[@]}"
            exit 1
          fi

          echo "Preserved Windows runtime matches the comparison base."

  build:
    name: ${{ matrix.compiler }}
    needs: preserve-windows-runtime
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libsdl2-image-dev \
            libgl1-mesa-dev \
            libfreetype6-dev \
            xvfb \
            xauth

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DKIRKWARE_BUILD_TESTS=ON -DKIRKWARE_BUILD_UI=ON

      - name: Build
        run: cmake --build build-linux --parallel 2

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure

      - name: Install smoke test
        run: |
          cmake --install build-linux --prefix "$PWD/install-root"
          test -x install-root/bin/kirkware
          test -x install-root/bin/kirkware-ui
          test -f install-root/lib/kirkware/libkirkware_component.so
          test -f install-root/share/kirkware/garrys-mod.png

      - name: Package tarball
        run: cpack --config build-linux/CPackConfig.cmake -G TGZ -B packages

      - name: Package Debian
        run: cpack --config build-linux/CPackConfig.cmake -G DEB -B packages

      - name: Verify package metadata
        run: dpkg-deb --info packages/*.deb

      - name: Generate checksums
        run: |
          sha256sum build-linux/kirkware build-linux/kirkware-ui build-linux/libkirkware_component.so > packages/SHA256SUMS
          sha256sum packages/*.tar.gz packages/*.deb >> packages/SHA256SUMS

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: kirkware-linux-${{ matrix.compiler }}
          path: |
            build-linux/kirkware
            build-linux/kirkware-ui
            build-linux/libkirkware_component.so
            packages/*.tar.gz
            packages/*.deb
            packages/SHA256SUMS
          if-no-files-found: error

  sanitizers:
    name: sanitizers
    needs: preserve-windows-runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsdl2-dev \
            libsdl2-image-dev \
            libgl1-mesa-dev \
            libfreetype6-dev \
            xvfb \
            xauth

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKIRKWARE_BUILD_TESTS=ON -DKIRKWARE_BUILD_UI=ON -DKIRKWARE_ENABLE_SANITIZERS=ON -DKIRKWARE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
