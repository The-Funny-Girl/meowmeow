name: Linux build

on:
  push:
    branches: [main, linux-port]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DKIRKWARE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-linux --parallel 2

      - name: Test
        run: ctest --test-dir build-linux --output-on-failure

      - name: Install smoke test
        run: cmake --install build-linux --prefix "$PWD/install-root"

      - name: Package tarball
        run: cpack --config build-linux/CPackConfig.cmake -G TGZ -B packages

      - name: Package Debian
        run: cpack --config build-linux/CPackConfig.cmake -G DEB -B packages

      - name: Verify package metadata
        run: dpkg-deb --info packages/*.deb

      - name: Generate checksums
        run: |
          sha256sum build-linux/kirkware > packages/SHA256SUMS
          sha256sum packages/*.tar.gz packages/*.deb >> packages/SHA256SUMS

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: kirkware-linux-${{ matrix.compiler }}
          path: |
            build-linux/kirkware
            packages/*.tar.gz
            packages/*.deb
            packages/SHA256SUMS
          if-no-files-found: error

  sanitizers:
    name: sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKIRKWARE_BUILD_TESTS=ON -DKIRKWARE_ENABLE_SANITIZERS=ON -DKIRKWARE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel 2

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
