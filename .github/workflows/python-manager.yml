name: Python manager

on:
  push:
    branches:
      - main
      - python-manager-native-module
      - python-manager-audit-fixes
  pull_request:

jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Python manager and native payload generator
        run: |
          python3 -m py_compile kirkware.py
          python3 -m py_compile source/gmod_native/embed_lua.py

      - name: Run manager self-test
        run: python3 kirkware.py self-test

      - name: Check command help
        run: |
          python3 kirkware.py --help
          python3 kirkware.py build --help
          python3 kirkware.py loader --help
          python3 kirkware.py native --help
          python3 kirkware.py gmod --help

      - name: Fetch pinned Garry's Mod module headers
        run: |
          git init .ci/garrysmod_common
          git -C .ci/garrysmod_common remote add origin https://github.com/danielga/garrysmod_common.git
          git -C .ci/garrysmod_common fetch --depth 1 origin f77a18d86f780a59ea30e4237016b05b790d4b70
          git -C .ci/garrysmod_common checkout --detach FETCH_HEAD

      - name: Build Linux x64 GMod native module
        run: python3 kirkware.py native build --gmcommon .ci/garrysmod_common --no-fetch --clean

      - name: Verify native artifacts are ELF and export GMod entry points
        run: |
          test -f build-gmod-native/gmcl_kirkware_native_linux64.dll
          test -f build-gmod-native/libkirkware_native.so
          file build-gmod-native/gmcl_kirkware_native_linux64.dll | grep -q 'ELF 64-bit'
          file build-gmod-native/libkirkware_native.so | grep -q 'ELF 64-bit'
          cmp build-gmod-native/gmcl_kirkware_native_linux64.dll build-gmod-native/libkirkware_native.so
          nm -D build-gmod-native/libkirkware_native.so | grep -q ' gmod13_open$'
          nm -D build-gmod-native/libkirkware_native.so | grep -q ' gmod13_close$'

      - name: Verify client feature payloads are embedded
        run: |
          test -f build-gmod-native/generated/kirkware_embedded_lua.hpp
          expected="$(find source/gmod_addon/kirkware_linux/lua/autorun/client -maxdepth 1 -type f -name '*.lua' ! -name 'kirkware_linux_native.lua' | wc -l)"
          embedded="$(grep -c '^    {\".*\.lua\", kPayload' build-gmod-native/generated/kirkware_embedded_lua.hpp)"
          test "$expected" -eq "$embedded"
          grep -q 'kirkware_linux.lua' build-gmod-native/generated/kirkware_embedded_lua.hpp
          grep -q 'kirkware_linux_combat.lua' build-gmod-native/generated/kirkware_embedded_lua.hpp
          grep -q 'kirkware_linux_modules.lua' build-gmod-native/generated/kirkware_embedded_lua.hpp
          strings build-gmod-native/libkirkware_native.so | grep -q 'kirkware_embedded/'
