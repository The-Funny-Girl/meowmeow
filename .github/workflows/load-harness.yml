name: Linux load harness

on:
  push:
    branches: [linux-load-harness, linux-load-harness-signal-ipc, configurable-control-root]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: load-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate helper scripts
        run: |
          test -x build-load-harness.sh
          test -x build-linux.sh
          test -x update-kirkware.sh
          bash -n build-load-harness.sh
          bash -n build-linux.sh
          bash -n update-kirkware.sh
          ./build-load-harness.sh --help >/dev/null
          ./build-linux.sh --help >/dev/null
          ./update-kirkware.sh --help >/dev/null

      - name: Build and test
        run: ./build-load-harness.sh

      - name: Exercise PID signal IPC with custom control root
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$PWD/build-load-harness/kirkware-load-target"
          client="$PWD/build-load-harness/kirkware-load-client"
          module="$PWD/build-load-harness/libkirkware_load_test.so"
          control_root="$RUNNER_TEMP/kirkware-control-root"
          mkdir -p -- "$control_root"

          KIRKWARE_LOAD_CONTROL_ROOT="$control_root" \
            "$target" >"$RUNNER_TEMP/kirkware-load-target-ci.log" 2>&1 &
          target_pid=$!
          control_dir="$control_root/kirkware-load-target-$(id -u)-${target_pid}"

          cleanup() {
            kill "$target_pid" 2>/dev/null || true
            wait "$target_pid" 2>/dev/null || true
            rm -rf -- "$control_dir" "$control_root"
          }
          trap cleanup EXIT

          for _ in $(seq 1 100); do
            [[ -d "$control_dir" ]] && break
            sleep 0.05
          done
          test -d "$control_dir"

          env KIRKWARE_LOAD_CONTROL_ROOT="$control_root" "$client" --target "$target_pid" --status | grep -F 'OK unloaded'
          env KIRKWARE_LOAD_CONTROL_ROOT="$control_root" "$client" --target "$target_pid" --load "$module" | grep -F 'OK loaded'
          env KIRKWARE_LOAD_CONTROL_ROOT="$control_root" "$client" --target "$target_pid" --status | grep -F 'OK loaded'
          env KIRKWARE_LOAD_CONTROL_ROOT="$control_root" "$client" --target "$target_pid" --unload | grep -F 'OK unloaded'
          env KIRKWARE_LOAD_CONTROL_ROOT="$control_root" "$client" --target "$target_pid" --quit | grep -F 'OK quitting'
          wait "$target_pid"
          trap - EXIT

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test with ASan/UBSan
        run: ./build-load-harness.sh --sanitize
