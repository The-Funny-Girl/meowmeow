name: Garry's Mod addon

on:
  push:
    branches: [linux-ingame-menu]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gmod-addon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addon:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Validate helper scripts
        run: |
          test -x install-gmod-addon.sh
          bash -n install-gmod-addon.sh
          bash -n build-linux.sh

      - name: Validate addon Lua syntax
        run: |
          set -euo pipefail
          find source/gmod_addon/kirkware_linux/lua -type f -name '*.lua' -print0 |
            sort -z |
            xargs -0 -n1 luac5.4 -p

      - name: Test addon installation
        run: |
          set -euo pipefail
          fake_game="$RUNNER_TEMP/GarrysMod"
          mkdir -p "$fake_game/garrysmod/addons"
          ./install-gmod-addon.sh --game-dir "$fake_game"
          test -f "$fake_game/garrysmod/addons/kirkware_linux/addon.json"
          test -f "$fake_game/garrysmod/addons/kirkware_linux/lua/autorun/client/kirkware_linux.lua"
          test -f "$fake_game/garrysmod/addons/kirkware_linux/lua/autorun/client/kirkware_linux_modules.lua"
          ./install-gmod-addon.sh --game-dir "$fake_game" --uninstall
          test ! -e "$fake_game/garrysmod/addons/kirkware_linux"
